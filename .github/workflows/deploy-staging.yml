name: Deploy staging to Firebase

on:
  workflow_dispatch:
  push:
    branches: [test]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
      FIREBASE_DEPLOY_TOKEN: ${{ secrets.FIREBASE_DEPLOY_TOKEN_STAGING }}
      VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG_STAGING }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: npm install

      - name: Build project (staging config)
        run: npm run build

      - name: Install Functions dependencies
        run: cd functions && npm install

      - name: Derive staging project ID
        id: project
        run: echo "id=$(node -e "console.log(JSON.parse(process.env.VITE_FIREBASE_CONFIG).projectId)")" >> "$GITHUB_OUTPUT"
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG_STAGING }}

      - name: Deploy to Firebase (staging)
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          firebase deploy --only hosting,functions --project "$PROJECT_ID" --token "$FIREBASE_DEPLOY_TOKEN"
        env:
          PROJECT_ID: ${{ steps.project.outputs.id }}
        shell: bash
